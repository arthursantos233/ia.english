<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon English Tutor | Mr. Davies (Fixed Voice)</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --roxo: #9b30ff;
            --azul: #00d4ff;
            --roxo-glow: #b14eff;
            --azul-glow: #66e3ff;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Poppins', sans-serif;
        }
        body {
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .particle {
            position: absolute;
            background: var(--roxo);
            border-radius: 50%;
            filter: blur(4px);
            opacity: 0.3;
            animation: float 8s infinite ease-in-out;
        }
        .particle:nth-child(odd) { background: var(--azul); }
        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.2); }
        }
        .chat-container {
            width: 100%;
            max-width: 700px;
            height: 85vh;
            background: rgba(10, 10, 10, 0.85);
            border: 2px solid var(--roxo);
            border-radius: 24px;
            box-shadow: 0 0 25px var(--roxo-glow), 0 0 60px rgba(155, 48, 255, 0.4);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 10;
            backdrop-filter: blur(8px);
        }
        .chat-header {
            background: linear-gradient(135deg, #1a0a2e, #0a1128);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid var(--roxo);
            box-shadow: 0 0 12px var(--roxo);
        }
        .avatar-container { position: relative; width: 70px; height: 70px; }
        .avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffffff, #b0b0b0);
            box-shadow: 0 0 20px var(--azul), 0 0 40px var(--roxo);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: avatarPulse 2s infinite alternate;
        }
        @keyframes avatarPulse {
            0% { box-shadow: 0 0 20px var(--azul), 0 0 40px var(--roxo); }
            100% { box-shadow: 0 0 35px var(--azul-glow), 0 0 70px var(--roxo-glow); }
        }
        .face { position: relative; width: 50px; height: 50px; }
        .eyes { display: flex; justify-content: space-between; width: 40px; margin: 8px auto 0; }
        .eye { width: 10px; height: 14px; background: #111; border-radius: 50%; position: relative; }
        .eye::after { content: ''; position: absolute; width: 4px; height: 4px; background: white; border-radius: 50%; top: 3px; left: 3px; }
        .mouth {
            width: 20px; height: 4px; background: #222;
            margin: 8px auto 0; border-radius: 0 0 10px 10px; transition: all 0.1s ease;
        }
        .speaking .mouth {
            height: 12px; border-radius: 50%; background: #333;
            animation: talk 0.2s infinite alternate;
        }
        @keyframes talk {
            0% { height: 12px; } 100% { height: 18px; }
        }
        .header-text h1 {
            font-size: 1.6rem; color: white;
            text-shadow: 0 0 8px var(--azul), 0 0 18px var(--roxo); letter-spacing: 1px;
        }
        .subtitle { font-size: 0.85rem; color: #ccc; text-shadow: 0 0 5px var(--roxo); }
        .sound-test-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--azul);
            color: var(--azul);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.2s;
            margin-left: auto;
        }
        .sound-test-btn:hover {
            background: var(--azul);
            color: black;
            box-shadow: 0 0 15px var(--azul-glow);
        }
        .chat-messages {
            flex: 1; overflow-y: auto; padding: 20px;
            display: flex; flex-direction: column; gap: 16px; background: transparent;
        }
        .message { display: flex; }
        .message.user { justify-content: flex-end; }
        .message-content {
            max-width: 80%; padding: 12px 18px; border-radius: 20px;
            line-height: 1.5; font-size: 1rem; word-wrap: break-word;
            animation: messagePop 0.3s ease;
        }
        @keyframes messagePop {
            0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; }
        }
        .message.bot .message-content {
            background: #0d1b2a; border: 1px solid var(--azul);
            color: #e0f0ff; box-shadow: 0 0 8px rgba(0, 212, 255, 0.3); border-bottom-left-radius: 4px;
        }
        .message.user .message-content {
            background: #2a1a3a; border: 1px solid var(--roxo);
            color: white; box-shadow: 0 0 8px rgba(155, 48, 255, 0.4); border-bottom-right-radius: 4px;
        }
        .correction-note {
            background: rgba(255, 193, 7, 0.1); border-left: 3px solid #ffc107;
            padding: 6px 10px; margin-top: 6px; font-size: 0.85rem;
            border-radius: 0 6px 6px 0; color: #ffd966; text-shadow: 0 0 4px black;
        }
        .chat-input-area {
            display: flex; padding: 14px 16px;
            background: rgba(0,0,0,0.6); border-top: 1px solid var(--roxo); gap: 10px; align-items: center;
        }
        #userInput {
            flex: 1; padding: 12px 18px; border: 2px solid var(--roxo);
            border-radius: 30px; font-size: 1rem; outline: none;
            background: #111; color: white; caret-color: var(--azul);
            transition: border 0.3s, box-shadow 0.3s;
        }
        #userInput:focus { border-color: var(--azul); box-shadow: 0 0 12px var(--azul); }
        .btn {
            border: none; color: white; cursor: pointer; border-radius: 50%;
            width: 48px; height: 48px; display: flex; align-items: center;
            justify-content: center; font-size: 1.3rem; transition: all 0.2s; background: transparent;
        }
        #micButton {
            background: rgba(155,48,255,0.2); border: 2px solid var(--roxo); box-shadow: 0 0 10px var(--roxo);
        }
        #micButton:hover { background: var(--roxo); box-shadow: 0 0 18px var(--roxo-glow); }
        #micButton.listening {
            background: #e74c3c; border-color: #e74c3c;
            box-shadow: 0 0 20px #e74c3c; animation: pulseMic 1s infinite;
        }
        @keyframes pulseMic {
            0% { box-shadow: 0 0 10px #e74c3c; } 50% { box-shadow: 0 0 30px #e74c3c; } 100% { box-shadow: 0 0 10px #e74c3c; }
        }
        #sendButton {
            background: rgba(0,212,255,0.2); border: 2px solid var(--azul);
            box-shadow: 0 0 10px var(--azul); border-radius: 30px;
            width: auto; padding: 12px 20px; font-weight: 600; font-size: 0.9rem;
        }
        #sendButton:hover { background: var(--azul); box-shadow: 0 0 18px var(--azul-glow); }
        #sendButton:disabled, #micButton:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
        .status-bar {
            text-align: center; padding: 4px; background: #000;
            color: var(--azul); font-size: 0.8rem; border-top: 1px solid var(--roxo);
            text-shadow: 0 0 6px var(--azul);
        }
        .typing-indicator {
            display: flex; gap: 4px; padding: 12px 16px;
            background: #0d1b2a; border: 1px solid var(--azul);
            border-radius: 20px; width: fit-content; box-shadow: 0 0 8px rgba(0,212,255,0.3);
        }
        .typing-indicator span {
            width: 8px; height: 8px; background: var(--azul);
            border-radius: 50%; animation: typingBounce 1.2s infinite ease-in-out;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    <div class="chat-container">
        <header class="chat-header">
            <div class="avatar-container">
                <div class="avatar" id="avatar">
                    <div class="face">
                        <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
                        <div class="mouth" id="mouth"></div>
                    </div>
                </div>
            </div>
            <div class="header-text">
                <h1>Mr. Davies</h1>
                <p class="subtitle">Neon English Tutor</p>
            </div>
            <button class="sound-test-btn" id="soundTestBtn" title="Test speaker">🔊</button>
        </header>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-area">
            <button class="btn" id="micButton" title="Click to speak">🎤</button>
            <input type="text" id="userInput" placeholder="Type or speak in English..." autocomplete="off">
            <button class="btn" id="sendButton">Send</button>
        </div>
        <div class="status-bar" id="statusBar">Ready</div>
    </div>
    <script>
        (function() {
            // Elementos DOM
            const chatMessages = document.getElementById('chatMessages');
            const userInput = document.getElementById('userInput');
            const sendButton = document.getElementById('sendButton');
            const micButton = document.getElementById('micButton');
            const statusBar = document.getElementById('statusBar');
            const avatar = document.getElementById('avatar');
            const soundTestBtn = document.getElementById('soundTestBtn');
            const particlesContainer = document.getElementById('particles');

            // Partículas de fundo
            for (let i = 0; i < 25; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = Math.random() * 6 + 2;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = Math.random() * 100 + '%';
                p.style.top = Math.random() * 100 + '%';
                p.style.animationDelay = Math.random() * 8 + 's';
                p.style.animationDuration = (Math.random() * 8 + 6) + 's';
                particlesContainer.appendChild(p);
            }

            // Estado da conversa
            const state = {
                currentTopic: null,
                lastQuestion: null,
                questionPending: false,
                turnCount: 0
            };

            const topics = ['travel', 'food', 'hobbies', 'music', 'movies', 'sports', 'technology', 'books', 'daily routine', 'dreams'];
            const topicQuestions = {
                travel: ["Have you ever been to another country?", "What's your dream travel destination?", "Do you prefer beaches or mountains?", "What do you usually pack for a trip?"],
                food: ["What's your favorite dish?", "Do you enjoy cooking?", "Have you tried any foreign cuisine?", "What did you eat for breakfast today?"],
                hobbies: ["What do you like to do in your free time?", "Do you play any musical instruments?", "Have you ever tried painting or drawing?", "What hobby would you like to start?"],
                music: ["What kind of music do you listen to?", "Do you have a favorite band or singer?", "Have you ever been to a concert?", "Can you play any instrument?"],
                movies: ["What's the last movie you watched?", "Do you prefer action or comedy?", "Who's your favorite actor?", "Have you seen any good films lately?"],
                sports: ["Do you practice any sport?", "What's your favorite sport to watch?", "Have you ever run a marathon?", "Do you prefer team or individual sports?"],
                technology: ["How often do you use your smartphone?", "What's your favorite app?", "Do you think technology makes life easier?", "Have you ever built a computer?"],
                books: ["Do you enjoy reading?", "What's the last book you read?", "Who's your favorite author?", "Do you prefer fiction or non-fiction?"],
                'daily routine': ["What time do you usually wake up?", "What's the first thing you do in the morning?", "Do you have a busy schedule?", "How do you relax after work or school?"],
                dreams: ["What's a big dream you have?", "Where do you see yourself in five years?", "Have you ever had a recurring dream?", "If you could achieve anything, what would it be?"]
            };
            const greetings = ["hello", "hi", "hey", "good morning", "good afternoon", "good evening", "howdy", "what's up", "yo", "greetings"];
            const farewells = ["bye", "goodbye", "see you", "take care", "have a nice day", "farewell"];

            function followUpResponse(userMsg) {
                const msg = userMsg.toLowerCase().trim();
                if (msg.length < 5) return "Could you tell me a bit more? I'd love to hear details!";
                const enc = ["That's interesting! ", "I see! ", "Thanks for sharing that. ", "Oh, that sounds great! ", "Really? That's cool. "];
                const fu = ["Can you tell me more about that?", "Why do you like it so much?", "How did you get into that?", "What do you enjoy most about it?", "How often do you do that?"];
                return enc[Math.floor(Math.random()*enc.length)] + fu[Math.floor(Math.random()*fu.length)];
            }

            function checkAndCorrect(text) {
                const corrections = [
                    { pattern: /\bi goes\b/i, correction: "I go", explanation: "Use 'go' with 'I' — 'I go', not 'I goes'." },
                    { pattern: /\bhe go\b/i, correction: "he goes", explanation: "With 'he', use 'goes' — 'he goes'." },
                    { pattern: /\bshe go\b/i, correction: "she goes", explanation: "With 'she', use 'goes' — 'she goes'." },
                    { pattern: /\bthey goes\b/i, correction: "they go", explanation: "With 'they', use 'go' — 'they go'." },
                    { pattern: /\bi is\b/i, correction: "I am", explanation: "Use 'I am', not 'I is'." },
                    { pattern: /\byou is\b/i, correction: "you are", explanation: "Use 'you are', not 'you is'." },
                    { pattern: /\bhe don't\b/i, correction: "he doesn't", explanation: "Use 'doesn't' with he/she — 'he doesn't'." },
                    { pattern: /\bshe don't\b/i, correction: "she doesn't", explanation: "Use 'doesn't' with he/she — 'she doesn't'." },
                    { pattern: /\bi have (\d+) years?\b/i, correction: (match, num) => `I am ${num} years old`, explanation: "In English, say 'I am X years old', not 'I have X years'." },
                    { pattern: /\bmore better\b/i, correction: "better", explanation: "'Better' already means 'more good'. Don't use 'more'." },
                    { pattern: /\bpeople is\b/i, correction: "people are", explanation: "'People' is plural — 'people are'." },
                    { pattern: /\bcan to\b/i, correction: "can", explanation: "After 'can', use the base verb without 'to'." }
                ];
                for (let rule of corrections) {
                    const match = text.match(rule.pattern);
                    if (match) {
                        let corrected;
                        if (typeof rule.correction === 'function') corrected = rule.correction(...match);
                        else corrected = text.replace(rule.pattern, rule.correction);
                        return { original: match[0], corrected, explanation: rule.explanation };
                    }
                }
                return null;
            }

            function generateReply(userMessage) {
                const msg = userMessage.toLowerCase().trim();
                state.turnCount++;
                if (farewells.some(f => msg.includes(f))) {
                    state.questionPending = false;
                    return { text: "It was nice talking to you! Keep practicing your English. See you next time! 👋", correction: null };
                }
                if (state.turnCount === 1 || greetings.some(g => msg.includes(g)) || msg.includes("how are you")) {
                    state.questionPending = true;
                    const responses = [
                        "Hello! I'm Mr. Davies, your English tutor. I'm doing great, thanks for asking! How about you? How are you feeling today?",
                        "Hi there! Wonderful to meet you. I'm very well, thank you. And you? How's your day going?",
                        "Hey! Great to see you. I'm fantastic, ready to help you practice English. How are you doing?"
                    ];
                    return { text: responses[Math.floor(Math.random()*responses.length)], correction: null };
                }
                if (state.questionPending) {
                    state.questionPending = false;
                    const correctionResult = checkAndCorrect(userMessage);
                    let replyText = followUpResponse(userMessage);
                    if (state.turnCount % 3 === 0 || !state.currentTopic) {
                        const newTopic = topics[Math.floor(Math.random()*topics.length)];
                        state.currentTopic = newTopic;
                        const questions = topicQuestions[newTopic];
                        const newQ = questions[Math.floor(Math.random()*questions.length)];
                        state.lastQuestion = newQ;
                        state.questionPending = true;
                        replyText += ` Let's talk about <b>${newTopic}</b>. ${newQ}`;
                    } else {
                        const questions = topicQuestions[state.currentTopic];
                        const newQ = questions[Math.floor(Math.random()*questions.length)];
                        state.lastQuestion = newQ;
                        state.questionPending = true;
                        replyText += ` ${newQ}`;
                    }
                    return { text: replyText, correction: correctionResult };
                }
                if (msg.includes("your name") || msg.includes("who are you")) return { text: "I'm Mr. Davies, your virtual English teacher! I'm here to help you practice conversation, grammar, and vocabulary. 😊", correction: null };
                if (msg.includes("how old are you") || msg.includes("your age")) return { text: "I'm a virtual teacher, so I don't have an age! But I have years of experience helping students like you. 😄", correction: null };
                if (msg.includes("where are you from")) return { text: "I come from the world of language learning! I'm here to help you anytime, anywhere.", correction: null };
                if (msg.includes("thank")) return { text: "You're very welcome! I'm happy to help. 😊 Keep up the good work!", correction: null };
                if (msg.length < 10 && !msg.includes("?")) {
                    const newTopic = topics[Math.floor(Math.random()*topics.length)];
                    state.currentTopic = newTopic;
                    const questions = topicQuestions[newTopic];
                    const newQ = questions[Math.floor(Math.random()*questions.length)];
                    state.lastQuestion = newQ;
                    state.questionPending = true;
                    return { text: `Let's talk about <b>${newTopic}</b>! ${newQ}`, correction: null };
                }
                const correctionResult = checkAndCorrect(userMessage);
                const questions = state.currentTopic ? topicQuestions[state.currentTopic] : topicQuestions['hobbies'];
                const newQ = questions[Math.floor(Math.random()*questions.length)];
                state.lastQuestion = newQ;
                state.questionPending = true;
                return { text: "I see! " + newQ, correction: correctionResult };
            }

            // ========== SÍNTESE DE VOZ CORRIGIDA ==========
            let isSpeaking = false;
            function speak(text, callback) {
                if (!('speechSynthesis' in window)) {
                    console.warn('TTS not supported');
                    if (callback) callback();
                    return;
                }
                // Cancela qualquer fala anterior
                window.speechSynthesis.cancel();
                const cleanText = text.replace(/<[^>]*>/g, '');
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                utterance.pitch = 1.1;

                // Função para definir voz, executada imediatamente e após carregamento
                function setVoice() {
                    const voices = window.speechSynthesis.getVoices();
                    const maleVoice = voices.find(v => v.lang.startsWith('en') && v.name.includes('Male')) ||
                                      voices.find(v => v.lang.startsWith('en'));
                    if (maleVoice) utterance.voice = maleVoice;
                }
                setVoice();
                window.speechSynthesis.onvoiceschanged = setVoice;

                utterance.onstart = () => {
                    isSpeaking = true;
                    avatar.classList.add('speaking');
                };
                utterance.onend = () => {
                    isSpeaking = false;
                    avatar.classList.remove('speaking');
                    if (callback) callback();
                };
                utterance.onerror = (e) => {
                    console.error('TTS error:', e.error);
                    isSpeaking = false;
                    avatar.classList.remove('speaking');
                    if (callback) callback();
                };

                // Força um pequeno delay para garantir que o cancel foi processado
                setTimeout(() => {
                    window.speechSynthesis.speak(utterance);
                }, 50);
            }

            // Botão de teste de som
            soundTestBtn.addEventListener('click', () => {
                speak("Sound works! I am Mister Davies.", () => {
                    statusBar.textContent = 'Speaker test complete.';
                });
                statusBar.textContent = 'Testing speaker...';
            });

            // ========== RECONHECIMENTO DE VOZ ==========
            let recognition = null;
            let isListening = false;

            function initSpeechRecognition() {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    statusBar.textContent = 'Speech recognition not supported. Use Chrome/Edge.';
                    micButton.disabled = true;
                    return null;
                }
                const recog = new SpeechRecognition();
                recog.continuous = false;
                recog.interimResults = false;
                recog.lang = 'en-US';
                recog.maxAlternatives = 1;

                recog.onstart = () => {
                    isListening = true;
                    micButton.classList.add('listening');
                    statusBar.textContent = '🎤 Listening... Speak now.';
                    userInput.disabled = true;
                };
                recog.onresult = (event) => {
                    const transcript = event.results[0][0].transcript.trim();
                    if (transcript) {
                        userInput.value = transcript;
                        statusBar.textContent = 'Heard: ' + transcript;
                        handleSend();
                    }
                };
                recog.onerror = (event) => {
                    console.error('Speech error:', event.error);
                    if (event.error === 'not-allowed') {
                        statusBar.textContent = 'Microphone blocked. Allow in site settings.';
                    } else if (event.error === 'no-speech') {
                        statusBar.textContent = 'No speech detected. Try again.';
                    } else {
                        statusBar.textContent = 'Voice error: ' + event.error;
                    }
                    stopListening();
                };
                recog.onend = () => {
                    stopListening();
                };
                return recog;
            }

            function startListening() {
                if (isListening) return;
                if (!recognition) {
                    recognition = initSpeechRecognition();
                    if (!recognition) return;
                }
                try {
                    recognition.start();
                } catch (e) {
                    console.error(e);
                    statusBar.textContent = 'Could not start recognition. Try again.';
                }
            }

            function stopListening() {
                isListening = false;
                micButton.classList.remove('listening');
                userInput.disabled = false;
                statusBar.textContent = 'Ready';
                if (recognition) {
                    try { recognition.stop(); } catch(e) {}
                }
            }

            micButton.addEventListener('click', () => {
                if (isListening) stopListening();
                else startListening();
            });

            // UI
            function addMessage(text, sender, correctionData = null) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${sender}`;
                const contentWrapper = document.createElement('div');
                contentWrapper.style.maxWidth = '85%';
                const contentDiv = document.createElement('div');
                contentDiv.className = 'message-content';
                contentDiv.innerHTML = text;
                contentWrapper.appendChild(contentDiv);
                if (correctionData && sender === 'bot') {
                    const note = document.createElement('div');
                    note.className = 'correction-note';
                    note.innerHTML = `📝 <b>Tip:</b> "${correctionData.original}" → <b>"${correctionData.corrected}"</b><br><small>${correctionData.explanation}</small>`;
                    contentWrapper.appendChild(note);
                }
                messageDiv.appendChild(contentWrapper);
                chatMessages.appendChild(messageDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            function showTypingIndicator() {
                const indicator = document.createElement('div');
                indicator.className = 'message bot';
                indicator.id = 'typingIndicator';
                const typingDiv = document.createElement('div');
                typingDiv.className = 'typing-indicator';
                typingDiv.innerHTML = '<span></span><span></span><span></span>';
                indicator.appendChild(typingDiv);
                chatMessages.appendChild(indicator);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            function removeTypingIndicator() {
                const el = document.getElementById('typingIndicator');
                if (el) el.remove();
            }

            let isProcessing = false;
            async function handleSend() {
                if (isProcessing) return;
                const message = userInput.value.trim();
                if (!message) return;

                isProcessing = true;
                userInput.disabled = true;
                sendButton.disabled = true;

                addMessage(message, 'user');
                userInput.value = '';
                showTypingIndicator();

                const delay = 300 + Math.random() * 400;
                await new Promise(resolve => setTimeout(resolve, delay));
                removeTypingIndicator();

                const replyData = generateReply(message);
                addMessage(replyData.text, 'bot', replyData.correction);

                // Agora que o usuário interagiu, o TTS funcionará
                speak(replyData.text, () => {
                    userInput.disabled = false;
                    sendButton.disabled = false;
                    userInput.focus();
                    isProcessing = false;
                });
            }

            sendButton.addEventListener('click', handleSend);
            userInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSend();
                }
            });

            userInput.addEventListener('focus', () => {
                if (isListening) stopListening();
            });

            // Iniciar conversa (apenas texto, sem áudio automático)
            function startConversation() {
                const greeting = "Hello! I'm <b>Mr. Davies</b>, your neon English tutor. 👨‍🏫<br>🔊 Click the speaker icon to test sound, then send me a message!<br>How are you today?";
                addMessage(greeting, 'bot');
                state.questionPending = true;
            }

            startConversation();
            userInput.focus();
        })();
    </script>
</body>
</html>
